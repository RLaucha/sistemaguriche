<style id="app-style">
@import url('https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap');

/* ---------- reset ---------- */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
ul{list-style:none}
a{color:inherit}

/* ---------- tokens ---------- */
:root{
  --bg:#EFE6D3;
  --surface:#FFFBF5;
  --surface-2:#F5EDE0;
  --surface-3:#EBE1D2;
  --ink:#241F1B;
  --muted:#6B5E54;
  --faint:#9A8D82;
  --border:#DDD3C5;
  --border-strong:#C9BBAB;
  --accent:#8A4B32;
  --accent-ink:#FFFBF5;
  --accent-soft:#F3E2D8;
  --accent-hover:#73392A;

  --slate:#6B7280;   --slate-bg:#E8EAED;
  --amber:#B8860B;   --amber-bg:#F9EED7;
  --blue:#2563EB;    --blue-bg:#DBEAFE;
  --green:#16A34A;   --green-bg:#DCFCE7;

  --shadow:0 1px 2px rgba(36,31,27,.05),0 6px 18px -8px rgba(36,31,27,.14), inset 1px 1px 0px rgba(255,255,255,0.4);
  --shadow-lg:0 12px 40px -12px rgba(36,31,27,.32), inset 1px 1px 0px rgba(255,255,255,0.4);
  --radius:16px;
  --radius-sm:9px;
  --maxw:1300px;
}
:root[data-theme="dark"]{
  --bg:#1A1513;
  --surface:#241F1B;
  --surface-2:#2E2722;
  --surface-3:#38302A;
  --ink:#EFE6D3;
  --muted:#B0A298;
  --faint:#8A7D73;
  --border:#3D332B;
  --border-strong:#4F4238;
  --accent:#D4845A;
  --accent-ink:#1A1513;
  --accent-soft:#3A2A20;
  --accent-hover:#E09B73;
  --slate:#A8B4C0;   --slate-bg:#2B3138;
  --amber:#E6AD5E;   --amber-bg:#3A2E1C;
  --blue:#60A5FA;    --blue-bg:#1E3A5F;
  --green:#4ADE80;   --green-bg:#183227;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px -8px rgba(0,0,0,.5), inset 1px 1px 0px rgba(255,255,255,0.05);
  --shadow-lg:0 16px 44px -12px rgba(0,0,0,.6), inset 1px 1px 0px rgba(255,255,255,0.05);
}

body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;
  font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
#app-root{display:block}

/* ---------- layout ---------- */
.shell{width:100%;min-height:100vh;margin:0}
@media (min-width:860px){
  .shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
}
.main{padding:18px 16px 96px;width:100%;box-sizing:border-box}
@media (min-width:860px){
  .main{padding:36px 48px 60px;max-width:1300px}
}

/* ---------- sidebar / topbar ---------- */
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{
  width:40px;height:40px;border-radius:12px;flex:none;
  background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;font-family:'Lora', Georgia, serif;font-weight:700;font-size:22px;
  box-shadow:var(--shadow);
  animation: pulse-glow 3s infinite alternate;
}
.brand-name{font-family:'Lora', Georgia, serif;font-weight:600;font-size:21px;letter-spacing:-.01em;line-height:1}
.brand-sub{font-size:11.5px;color:var(--faint);letter-spacing:.04em;text-transform:uppercase;margin-top:3px}

.sidebar{display:none}
@media (min-width:860px){
  .sidebar{
    display:flex;flex-direction:column;gap:6px;
    padding:28px 18px;border-right:1px solid var(--border);
    position:sticky;top:0;height:100vh;
    background: linear-gradient(180deg, var(--surface-2) 0%, var(--bg) 100%);
    width:260px;box-sizing:border-box;
  }
  .sidebar .brand{padding:0 8px 24px}
  .nav-link{
    display:flex;align-items:center;gap:12px;
    padding:11px 14px;border-radius:11px;color:var(--muted);
    font-weight:500;font-size:14.5px;transition:all 0.2s ease;
  }
  .nav-link svg{width:19px;height:19px;flex:none}
  .nav-link:hover{background:var(--surface-3);color:var(--ink); transform:translateX(2px)}
  .nav-link.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .nav-badge{margin-left:auto;font-size:11.5px;font-weight:600;background:var(--surface-3);color:var(--muted);
    padding:1px 8px;border-radius:20px;font-variant-numeric:tabular-nums}
  .nav-link.active .nav-badge{background:var(--accent);color:var(--accent-ink)}
  .sidebar-foot{margin-top:auto;padding:14px 8px 0;border-top:1px solid var(--border)}
}

/* mobile top bar */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px 6px;
}
@media (min-width:860px){.topbar{display:none}}

/* bottom nav (mobile) */
.tabbar{
  position:fixed;bottom:0;left:0;right:0;z-index:40;
  display:flex;background:rgba(255,251,245,0.85);border-top:1px solid var(--border);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  box-shadow:0 -6px 20px -12px rgba(36,31,27,.25);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .tabbar { background:rgba(36,31,27,0.85); }
}
:root[data-theme="dark"] .tabbar { background:rgba(36,31,27,0.85); }

@media (min-width:860px){.tabbar{display:none}}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 2px;color:var(--faint);font-size:10.5px;font-weight:500;position:relative;
  transition: all 0.2s ease;
}
.tab svg{width:22px;height:22px}
.tab.active{color:var(--accent)}
.tab:hover{color:var(--ink)}
.tab .dot{position:absolute;top:2px;right:calc(50% - 20px);min-width:15px;height:15px;padding:0 4px;
  background:var(--accent);color:var(--accent-ink);border-radius:20px;font-size:9.5px;font-weight:700;
  display:grid;place-items:center;line-height:1}

/* ---------- page head ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.page-title{font-family:'Lora', Georgia, serif;font-weight:600;font-size:27px;letter-spacing:-.015em}
.page-sub{color:var(--muted);font-size:14px;margin-top:2px}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;justify-content:center;
  padding:9px 15px;border-radius:10px;font-weight:600;font-size:14px;
  background:var(--surface);border:1px solid var(--border-strong);color:var(--ink);
  transition: all 0.2s ease;white-space:nowrap;
}
.btn:hover{background:var(--surface-2); transform:scale(1.02)}
.btn:active{transform:translateY(1px) scale(0.98)}
.btn svg{width:17px;height:17px; transition: transform 0.2s ease}
.btn--primary{
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%);
  border-color: transparent;
  color:var(--accent-ink);
  box-shadow: 0 2px 8px -2px rgba(138,75,50,0.4);
}
.btn--primary:hover{
  background: linear-gradient(135deg, var(--accent-hover) 0%, var(--accent) 100%);
  box-shadow: 0 4px 12px -2px rgba(138,75,50,0.5);
}
.btn--ghost{background:transparent;border-color:transparent;color:var(--muted);padding:7px 10px; box-shadow: none}
.btn--ghost:hover{background:var(--surface-2);color:var(--ink); transform:scale(1.02)}
.btn--sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn--danger:hover{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.btn:focus-visible,.tab:focus-visible,.nav-link:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px}

/* ---------- cards ---------- */
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);
  transition: all 0.2s ease;
}
.card:hover{
  transform: translateY(-2px);
  box-shadow: var(--shadow-lg);
}

.grid{display:grid;gap:14px}
.stat-grid{grid-template-columns:repeat(2,1fr)}
@media (min-width:640px){.stat-grid{grid-template-columns:repeat(4,1fr)}}

.stat{padding:16px 16px 15px;position:relative;overflow:hidden;
  background: linear-gradient(145deg, var(--surface) 0%, var(--surface-2) 100%);
}
.stat .k{font-size:12.5px;color:var(--muted);font-weight:500;letter-spacing:.01em}
.stat .v{font-family:'Lora', Georgia, serif;font-weight:600;font-size:34px;line-height:1.05;margin-top:6px;font-variant-numeric:tabular-nums}
.stat .hint{font-size:12px;color:var(--faint);margin-top:4px}
.stat .rail{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.stat.slate .rail{background:var(--slate)} .stat.amber .rail{background:var(--amber)}
.stat.blue .rail{background:var(--blue)} .stat.green .rail{background:var(--green)}

/* progress */
.bar{height:8px;border-radius:20px;background:var(--surface-3);overflow:hidden;margin-top:10px}
.bar > i{display:block;height:100%;
  background: linear-gradient(90deg, var(--accent) 0%, #a25c42 100%);
  border-radius:20px;transition:width .3s ease-out}

/* ---------- banner ---------- */
.banner{display:flex;align-items:center;gap:14px;padding:15px 17px;border-radius:var(--radius);
  background: linear-gradient(135deg, var(--accent-soft) 0%, var(--surface-2) 100%);
  border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);margin-bottom:18px;
  box-shadow: inset 1px 1px 0 rgba(255,255,255,0.4);
}
.banner .txt{flex:1}
.banner .txt b{font-family:'Lora', Georgia, serif;font-size:16px}
.banner .txt p{font-size:13px;color:var(--muted);margin-top:1px}

/* ---------- tags ---------- */
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:12px;font-size:12px;font-weight:600;letter-spacing:.01em; box-shadow: inset 0 1px 2px rgba(0,0,0,0.05)}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}
.tag.slate{color:var(--slate);background:var(--slate-bg)}
.tag.amber{color:var(--amber);background:var(--amber-bg)}
.tag.blue{color:var(--blue);background:var(--blue-bg)}
.tag.green{color:var(--green);background:var(--green-bg)}

/* ---------- filter chips ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.chip{padding:7px 13px;border-radius:20px;font-size:13px;font-weight:500;white-space:nowrap;
  background:var(--surface);border:1px solid var(--border);color:var(--muted); transition: all 0.2s ease;}
.chip:hover{background:var(--surface-2); color:var(--ink)}
.chip.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* ---------- search ---------- */
.search{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--border);
  border-radius:11px;padding:9px 13px;margin:14px 0; transition: all 0.2s ease;}
.search:focus-within{
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.search svg{width:18px;height:18px;color:var(--faint);flex:none; transition: color 0.2s ease}
.search:focus-within svg{color:var(--accent)}
.search input{border:none;background:none;outline:none;width:100%;font-size:15px; color:var(--ink)}

/* ---------- list items ---------- */
.list{display:flex;flex-direction:column;gap:11px}
.item{padding:14px 15px}
.item-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.item-title{font-weight:600;font-size:15.5px;letter-spacing:-.005em}
.item-meta{font-size:13px;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.item-meta .sep{color:var(--border-strong)}
.price{font-variant-numeric:tabular-nums;font-weight:600}
.price--cost{color:var(--faint);font-weight:500;font-size:12.5px}
.item-actions{display:flex;align-items:center;gap:6px;margin-top:12px;flex-wrap:wrap}
.mini-select{padding:6px 9px;border-radius:9px;border:1px solid var(--border-strong);background:var(--surface-2);
  font-size:12.5px;font-weight:600; transition: all 0.2s ease}
.mini-select:hover{border-color:var(--border-strong); background:var(--surface-3)}
.mini-select:focus{border-color:var(--accent); outline:none}

/* supplier products table */
.ptable{width:100%;border-collapse:collapse;margin-top:10px;font-size:13.5px}
.ptable th{text-align:left;font-weight:500;color:var(--faint);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;padding:0 8px 7px}
.ptable td{padding:8px;border-top:1px solid var(--border)}
.ptable td:last-child{text-align:right;white-space:nowrap}
.ptable .num{text-align:right;font-variant-numeric:tabular-nums}
.stock-pill{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--green-bg);color:var(--green); box-shadow: inset 0 1px 2px rgba(0,0,0,0.05)}
.stock-pill.low{background:var(--amber-bg);color:var(--amber)}
.stock-pill.out{background:var(--slate-bg);color:var(--slate)}

/* client mini rows */
.subrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-top:1px solid var(--border);font-size:13.5px}
.subrow:first-of-type{border-top:none}
.counts{display:flex;gap:7px;flex-wrap:wrap}
.count{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--surface-3);color:var(--muted)}

/* encargo */
.enc-pedidos{margin-top:12px;border-top:1px dashed var(--border-strong);padding-top:11px;display:flex;flex-direction:column;gap:7px}
.enc-line{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13.5px}
.enc-total{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:11px;border-top:1px solid var(--border);font-weight:600}

/* ---------- empty ---------- */
.empty{text-align:center;padding:46px 20px;color:var(--muted)}
.empty svg{width:44px;height:44px;color:var(--border-strong);margin-bottom:12px; animation: float 3s ease-in-out infinite}
.empty h3{font-family:'Lora', Georgia, serif;font-weight:600;font-size:19px;color:var(--ink);margin-bottom:5px}
.empty p{font-size:14px;max-width:340px;margin:0 auto 16px}

.section-label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin:26px 0 12px}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(36,31,27,.42);backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
@media (min-width:640px){.overlay{align-items:center;padding:20px}}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(14px) scale(0.98);opacity:0}}
@keyframes float{
  0% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
  100% { transform: translateY(0); }
}
@keyframes pulse-glow{
  0% { box-shadow: 0 0 0 0 rgba(138,75,50,0.4); }
  100% { box-shadow: 0 0 0 8px rgba(138,75,50,0); }
}

.modal{background:var(--surface);width:100%;max-width:480px;border-radius:20px 20px 0 0;box-shadow:var(--shadow-lg);
  max-height:92vh;overflow-y:auto;animation:rise .3s cubic-bezier(0.16, 1, 0.3, 1)}
@media (min-width:640px){.modal{border-radius:18px}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 6px;position:sticky;top:0;background:var(--surface); z-index:10;}
.modal-head h2{font-family:'Lora', Georgia, serif;font-weight:600;font-size:20px}
.modal-body{padding:8px 20px 22px}
.field{margin-top:14px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--ink)}
.field .opt{color:var(--faint);font-weight:500}
.input,select.input,textarea.input{
  width:100%;padding:11px 13px;border-radius:11px;border:1px solid var(--border-strong);
  background:var(--surface-2);font-size:15.5px;outline:none;transition:all .2s ease}
.input:focus,select.input:focus,textarea.input:focus{
  border-color:var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
textarea.input{resize:vertical;min-height:64px;font-family:inherit}
.field-row{display:flex;gap:11px}
.field-row > .field{flex:1;margin-top:14px}
.help{font-size:12px;color:var(--faint);margin-top:5px}
.modal-foot{display:flex;gap:10px;margin-top:22px}
.modal-foot .btn{flex:1}
.check-list{display:flex;flex-direction:column;gap:2px;margin-top:6px;max-height:44vh;overflow-y:auto}
.check{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:11px;border:1px solid var(--border);
  background:var(--surface-2);cursor:pointer; transition: all 0.2s ease}
.check:hover{background:var(--surface-3)}
.check input{width:19px;height:19px;accent-color:var(--accent);flex:none}
.check .c-title{font-weight:600;font-size:14px}
.check .c-meta{font-size:12.5px;color:var(--muted)}
.check.on{border-color:var(--accent);background:var(--accent-soft)}

/* toast */
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);z-index:80;
  background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:500;
  box-shadow:var(--shadow-lg);animation:rise .3s cubic-bezier(0.16, 1, 0.3, 1);max-width:90vw;text-align:center;
  border-left: 4px solid var(--accent);
}
@media (min-width:860px){.toast{bottom:28px}}

.ro-note{font-size:12px;color:var(--amber);background:var(--amber-bg);padding:2px 9px;border-radius:20px;font-weight:600}
.foot-note{font-size:12px;color:var(--faint);margin-top:26px;text-align:center;line-height:1.6}
.link-btn{color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:2px; transition: color 0.2s ease}
.link-btn:hover{color:var(--accent-hover)}

/* ---------- tareas ---------- */
.tarea-card{position:relative}
.tarea-card .rail{position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:var(--radius) 0 0 var(--radius)}
.tarea-card.prioridad-alta .rail{background:#DC2626}
.tarea-card.prioridad-media .rail{background:var(--amber)}
.tarea-card.prioridad-baja .rail{background:var(--green)}
.tarea-card.hecha{opacity:0.55}
.tarea-card.hecha .item-title{text-decoration:line-through}
.asignado-tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11.5px;font-weight:600}
.asignado-tag.juano{color:var(--blue);background:var(--blue-bg)}
.asignado-tag.lauti{color:var(--green);background:var(--green-bg)}

/* ---------- catálogo ---------- */
.cat-grid{display:grid;gap:14px}
@media(min-width:640px){.cat-grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1150px){.cat-grid{grid-template-columns:repeat(3,1fr)}}
.cat-item .cat-marca{font-size:12px;color:var(--faint);font-weight:500;text-transform:uppercase;letter-spacing:.03em}
.cat-item .cat-precios{display:flex;gap:10px;align-items:baseline;margin-top:4px}
.dispo-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}
.dispo-dot.si{background:var(--green)}.dispo-dot.no{background:var(--slate)}

/* ---------- whatsapp ---------- */
.btn--wa{background:#25D366!important;border-color:#25D366!important;color:#fff!important;font-size:12px;padding:4px 10px;box-shadow:none}
.btn--wa:hover{background:#1DA851!important;transform:scale(1.02)}
.wa-link{display:inline-flex;align-items:center;gap:5px}
.wa-link svg{width:14px;height:14px}

/* stale cotizado hint */
.stale-hint{color:var(--amber);font-size:12px;margin-top:5px}
.stale-hint a{color:var(--amber);font-weight:600}

/* more menu (mobile) */
.more-menu{position:fixed;bottom:68px;right:8px;z-index:45;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:6px;animation:rise .2s ease;min-width:170px}
.more-menu button{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;color:var(--muted);font-weight:500;font-size:14px;transition:all .15s ease;width:100%;text-align:left;background:none;border:none;cursor:pointer}
.more-menu button:hover{background:var(--surface-2);color:var(--ink)}
.more-menu button.active{background:var(--accent-soft);color:var(--accent)}
.more-menu button svg{width:18px;height:18px;flex:none}
.more-menu .mm-badge{margin-left:auto;font-size:11px;font-weight:600;background:var(--surface-3);color:var(--muted);padding:1px 7px;border-radius:20px}
@media(min-width:860px){.more-menu{display:none!important}}
.nav-divider{height:1px;background:var(--border);margin:8px 12px}
</style>

<div id="app-root"></div>

<script id="state-data" type="application/json">{"config":{"negocio":"Guriche","moneda":"$","minEncargo":5},"clientes":[],"proveedores":[],"pedidos":[],"encargos":[],"tareas":[],"catalogo":[],"seedVersion":0}</script>

<script id="app-code">
(function(){
  "use strict";

  /* ============ constantes ============ */
  var MIN_DEFAULT = 5;
  var EP = {
    cotizado:  {label:"Cotizado",  c:"slate", short:"Cotiz."},
    confirmado:{label:"Confirmado",c:"amber", short:"Conf."},
    encargado: {label:"En camino", c:"blue",  short:"Camino"},
    entregado: {label:"Entregado", c:"green", short:"Entreg."}
  };
  var EP_ORDER = ["cotizado","confirmado","encargado","entregado"];
  var EE = {
    armando:  {label:"Armando",   c:"slate"},
    realizado:{label:"En viaje",  c:"blue"},
    llegado:  {label:"Llegó",     c:"green"}
  };
  var CATS = {
    disenador:{label:"Diseñador",c:"amber"},
    nicho:    {label:"Nicho",    c:"slate"}
  };
  var ET_ORDER = ["pendiente","haciendo","hecha"];

  /* ============ estado en memoria ============ */
  var state = loadState();
  var ui = {
    view: lsGet("view","panel"),
    filter: "todos",
    q: "",
    modal: null,

    saving: false,

  };
  var artifactApi = undefined;   // undefined = sin resolver, null = no disponible
  var readOnly = false;

  /* ============ utilidades ============ */
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(m){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]; }); }
  function lsGet(k,d){ try{ var v=localStorage.getItem("guriche:"+k); return v==null?d:v; }catch(e){ return d; } }
  function lsSet(k,v){ try{ localStorage.setItem("guriche:"+k,v); }catch(e){} }
  function num(v){ v=parseFloat(v); return isFinite(v)?v:0; }
  function money(n){ var s=state.config.moneda||"$"; return s+" "+num(n).toLocaleString("es-AR"); }
  function byId(arr,id){ for(var i=0;i<arr.length;i++) if(arr[i].id===id) return arr[i]; return null; }
  function clienteName(id){ var c=byId(state.clientes,id); return c?c.nombre:"Sin cliente"; }
  function provName(id){ var p=byId(state.proveedores,id); return p?p.nombre:""; }
  function today(){ var d=new Date(); return d.toISOString().slice(0,10); }
  function fmtDate(s){ if(!s) return ""; var p=s.split("-"); return p.length===3?(p[2]+"/"+p[1]+"/"+p[0].slice(2)):s; }
  function min(){ return state.config.minEncargo||MIN_DEFAULT; }

  function loadState(){
    var s={};
    try{ s=JSON.parse(document.getElementById("state-data").textContent)||{}; }catch(e){ s={}; }
    s.config = s.config || {};
    if(!s.config.negocio) s.config.negocio="Guriche";
    if(!s.config.moneda) s.config.moneda="$";
    if(!s.config.minEncargo) s.config.minEncargo=MIN_DEFAULT;
    s.clientes = s.clientes||[];
    s.proveedores = s.proveedores||[];
    s.pedidos = s.pedidos||[];
    s.encargos = s.encargos||[];
    s.tareas = s.tareas||[];
    s.catalogo = s.catalogo||[];
    return s;
  }

  /* ============ sincronización Google Sheets ============ */
  var isSyncing = false;
  function getSheetsUrl(){
    return (state.config.sheetsUrl || lsGet("sheetsUrl", "") || "").trim();
  }

  function syncWithSheets(direction, silent){
    var url = getSheetsUrl();
    if(!url){
      if(!silent) showToast("Configurá la URL de Google Sheets en Ajustes");
      return Promise.resolve(false);
    }
    isSyncing = true;
    updateSaveHint();
    if(!silent) showToast(direction === "pull" ? "Descargando de Google Sheets…" : "Guardando en Google Sheets…");

    if(direction === "pull"){
      return fetch(url + (url.indexOf("?") >= 0 ? "&" : "?") + "action=get_all")
        .then(function(res){ return res.json(); })
        .then(function(data){
          isSyncing = false;
          updateSaveHint();
          if(data && !data.error){
            if(data.catalogo && Array.isArray(data.catalogo)) state.catalogo = data.catalogo;
            if(data.clientes && Array.isArray(data.clientes)) state.clientes = data.clientes;
            if(data.pedidos && Array.isArray(data.pedidos)) state.pedidos = data.pedidos;
            if(data.tareas && Array.isArray(data.tareas)) state.tareas = data.tareas;
            if(data.encargos && Array.isArray(data.encargos)) state.encargos = data.encargos;
            if(data.config && typeof data.config === "object"){
              if(data.config.negocio) state.config.negocio = data.config.negocio;
              if(data.config.moneda) state.config.moneda = data.config.moneda;
              if(data.config.minEncargo) state.config.minEncargo = data.config.minEncargo;
            }
            render();
            lsSet("state_backup", JSON.stringify(state));
            if(!silent) showToast("¡Sincronizado con Google Sheets! ☁️");
            return true;
          } else {
            if(!silent) showToast("Error de Sheets: " + (data.error || "Respuesta inválida"));
            return false;
          }
        })
        .catch(function(err){
          isSyncing = false;
          updateSaveHint();
          if(!silent) showToast("No se pudo conectar con Google Sheets");
          return false;
        });
    } else {
      var payload = {
        action: "sync_all",
        data: {
          config: state.config,
          catalogo: state.catalogo,
          clientes: state.clientes,
          pedidos: state.pedidos,
          tareas: state.tareas,
          encargos: state.encargos
        }
      };
      return fetch(url, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      })
      .then(function(res){ return res.json(); })
      .then(function(res){
        isSyncing = false;
        updateSaveHint();
        if(res && res.ok){
          if(!silent) showToast("¡Guardado en la nube! ☁️");
          return true;
        } else {
          if(!silent) showToast("Error al guardar en Sheets: " + (res.error || ""));
          return false;
        }
      })
      .catch(function(err){
        isSyncing = false;
        updateSaveHint();
        if(!silent) showToast("Error al enviar a Google Sheets");
        return false;
      });
    }
  }

  /* ============ persistencia (Artifact & Local) ============ */
  var HEAD = ""; // se calcula en buildDoc
  function buildDoc(st){
    var styleEl = document.getElementById("app-style");
    var style = styleEl ? styleEl.outerHTML : "";
    var code = document.getElementById("app-code").textContent;
    var json = JSON.stringify(st).replace(/</g,"\\u003c");
    var fav = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E🌸%3C/text%3E%3C/svg%3E";
    var head = '<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">'
      + '<title>Guriche</title><link rel="icon" href="'+fav+'">';
    var out = "<!doctype html>\n<html lang=\"es\">\n<head>"+head+"</head>\n<body>\n"
      + style + "\n"
      + '<div id="app-root"></div>\n'
      + '<script id="state-data" type="application/json">'+json+'<\/script>\n'
      + '<script id="app-code">'+code+'<\/script>\n'
      + "</body>\n</html>";
    return out;
  }

  function ensureApi(){
    if(artifactApi!==undefined) return Promise.resolve(artifactApi);
    if(!(window.claude && window.claude.use)){ artifactApi=null; return Promise.resolve(null); }
    return window.claude.use("artifact").then(function(a){ artifactApi=a; return a; })
      .catch(function(){ artifactApi=null; return null; });
  }

  function persist(msg){
    render();
    lsSet("state_backup", JSON.stringify(state));
    var url = getSheetsUrl();
    if(url && !readOnly){
      syncWithSheets("push", true);
    }
    if(readOnly) return;
    ui.saving=true; updateSaveHint();
    ensureApi().then(function(api){
      if(!api){ ui.saving=false; updateSaveHint(); return; }
      return api.publish(buildDoc(state)).then(function(){
      }).catch(function(e){
        ui.saving=false;
        updateSaveHint();
      });
    });
  }

  function updateSaveHint(){
    var h=document.getElementById("save-hint");
    if(h){
      if(isSyncing) h.textContent = "Sincronizando ☁️…";
      else if(ui.saving) h.textContent = "Guardando…";
      else {
        var url = getSheetsUrl();
        h.textContent = url ? "Conectado a Sheets ☁️" : "Modo local";
      }
    }
  }

  /* ============ selectores derivados ============ */
  function pedidosDe(clienteId){ return state.pedidos.filter(function(p){return p.clienteId===clienteId;}); }
  function pedidosDeEncargo(id){ return state.pedidos.filter(function(p){return p.encargoId===id;}); }
  function confirmadosLibres(){ return state.pedidos.filter(function(p){return p.estado==="confirmado";}); }
  function countEstado(e){ var n=0; state.pedidos.forEach(function(p){ if(p.estado===e)n++; }); return n; }
  function paraEntregar(){ return state.pedidos.filter(function(p){
    if(p.estado==="entregado") return false;
    if(!p.encargoId) return false;
    var e=byId(state.encargos,p.encargoId); return e && e.estado==="llegado";
  }); }

  /* ============ navegación ============ */
  var NAV=[
    ["panel","Panel"],["pedidos","Pedidos"],["clientes","Clientes"],
    ["proveedores","Proveedores"],["encargos","Encargos"]
  ];
  var NAV_MORE=[
    ["catalogo","Catálogo"],["tareas","Tareas"]
  ];
  function navBadge(key){
    if(key==="pedidos"){ var n=countEstado("cotizado")+countEstado("confirmado"); return n||0; }
    if(key==="encargos"){ return state.encargos.filter(function(e){return e.estado!=="llegado";}).length; }
    if(key==="clientes") return state.clientes.length;
    if(key==="proveedores") return state.proveedores.length;
    if(key==="tareas") return state.tareas.filter(function(t){return t.estado!=="hecha";}).length;
    if(key==="catalogo") return state.catalogo.length;
    return 0;
  }

  function sidebar(){
    var theme = document.documentElement.getAttribute("data-theme") || "light";
    var themeIcon = theme === "dark" ? "sun" : "moon";
    var themeTitle = theme === "dark" ? "Cambiar a Modo Crema (Claro)" : "Cambiar a Modo Oscuro";
    var hasSheets = Boolean(getSheetsUrl());
    var links=NAV.map(function(n){
      var b=navBadge(n[0]);
      return '<button class="nav-link'+(ui.view===n[0]?" active":"")+'" data-act="nav" data-view="'+n[0]+'">'
        +ic(n[0])+'<span>'+n[1]+'</span>'+(b?'<span class="nav-badge">'+b+'</span>':'')+'</button>';
    }).join("");
    var moreLinks=NAV_MORE.map(function(n){
      var b=navBadge(n[0]);
      return '<button class="nav-link'+(ui.view===n[0]?" active":"")+'" data-act="nav" data-view="'+n[0]+'">'
        +ic(n[0])+'<span>'+n[1]+'</span>'+(b?'<span class="nav-badge">'+b+'</span>':'')+'</button>';
    }).join("");
    return '<aside class="sidebar">'
      + brand()
      + '<nav style="display:flex;flex-direction:column;gap:4px">'+links+'<div class="nav-divider"></div>'+moreLinks+'</nav>'
      + (hasSheets ? '<div style="padding:10px 4px 0"><button class="btn btn--ghost btn--sm" style="width:100%;justify-content:center;font-size:12.5px" data-act="sheets:pull">'+ic("sync")+' Sincronizar Sheets</button></div>' : '')
      + '<div class="sidebar-foot">'
      +   '<div style="display:flex;align-items:center;justify-content:space-between;gap:6px">'
      +     '<button class="nav-link" style="flex:1" data-act="settings">'+ic("edit")+'<span>Ajustes</span></button>'
      +     '<button class="btn btn--ghost btn--sm" data-act="theme:toggle" title="'+themeTitle+'" aria-label="'+themeTitle+'">'+ic(themeIcon)+'</button>'
      +   '</div>'
      +   '<div id="save-hint" style="font-size:11px;color:var(--faint);padding:6px 12px 0"></div>'
      + '</div>'
      + '</aside>';
  }
  function brand(){
    return '<div class="brand"><div class="brand-mark">'+esc((state.config.negocio||"G").charAt(0).toUpperCase())+'</div>'
      +'<div><div class="brand-name">'+esc(state.config.negocio||"Guriche")+'</div>'
      +'<div class="brand-sub">Perfumería · por encargo</div></div></div>';
  }
  function topbar(){
    var theme = document.documentElement.getAttribute("data-theme") || "light";
    var themeIcon = theme === "dark" ? "sun" : "moon";
    var hasSheets = Boolean(getSheetsUrl());
    return '<div class="topbar">'+brand()
      +'<div style="display:flex;gap:4px">'
      +(hasSheets ? '<button class="btn btn--ghost btn--sm" data-act="sheets:pull" title="Sincronizar Sheets">'+ic("sync")+'</button>' : '')
      +'<button class="btn btn--ghost btn--sm" data-act="theme:toggle" aria-label="Cambiar tema">'+ic(themeIcon)+'</button>'
      +'<button class="btn btn--ghost btn--sm" data-act="settings" aria-label="Ajustes">'+ic("edit")+'</button>'
      +'</div></div>';
  }
  function tabbar(){
    var isMore = ui.view==="catalogo"||ui.view==="tareas";
    var tabs=NAV.map(function(n){
      var b=navBadge(n[0]);
      return '<button class="tab'+(ui.view===n[0]?" active":"")+'" data-act="nav" data-view="'+n[0]+'">'
        +(b?'<span class="dot">'+(b>99?"99+":b)+'</span>':'')
        +ic(n[0])+'<span>'+n[1]+'</span></button>';
    }).join("");
    var moreTab='<button class="tab'+(isMore?" active":"")+'" data-act="more:toggle">'
      +ic("more")+'<span>Más</span></button>';
    var moreMenu="";
    if(ui.showMore){
      moreMenu='<div class="more-menu">'+NAV_MORE.map(function(n){
        var b=navBadge(n[0]);
        return '<button class="'+(ui.view===n[0]?"active":"")+'" data-act="nav" data-view="'+n[0]+'">'
          +ic(n[0])+'<span>'+n[1]+'</span>'+(b?'<span class="mm-badge">'+b+'</span>':'')+'</button>';
      }).join("")+'</div>';
    }
    return '<nav class="tabbar">'+tabs+moreTab+'</nav>'+moreMenu;
  }

  /* ============ render principal ============ */
  function render(){
    var main;
    switch(ui.view){
      case "pedidos": main=viewPedidos(); break;
      case "clientes": main=viewClientes(); break;
      case "proveedores": main=viewProveedores(); break;
      case "encargos": main=viewEncargos(); break;
      case "tareas": main=viewTareas(); break;
      case "catalogo": main=viewCatalogo(); break;
      default: main=viewPanel();
    }
    var roNote = readOnly ? '<div class="banner" style="background:var(--amber-bg);border-color:var(--amber)"><div class="txt"><b>Modo solo lectura</b><p>No tenés permiso de edición sobre este link. Pedile al dueño que te comparta con acceso de edición.</p></div></div>' : '';
    var html = '<div class="shell">'+sidebar()
      +'<main class="main">'+topbar()+roNote+main+'</main></div>'
      +tabbar()
      +(ui.modal?renderModal():"");
    document.getElementById("app-root").innerHTML=html;
    updateSaveHint();
    lsSet("view",ui.view);
    if(ui._focusSearch){ var s=document.getElementById("search-input");
      if(s){ s.focus(); var v=s.value; s.value=""; s.value=v; } ui._focusSearch=false; }
  }

  function pageHead(title,sub,btnLabel,btnAct){

    return '<div class="page-head"><div><h1 class="page-title">'+esc(title)+'</h1>'
      +(sub?'<p class="page-sub">'+esc(sub)+'</p>':'')+'</div>'+btn+'</div>';

  function emptyState(icon,title,text,btnLabel,btnAct){
    return '<div class="card empty">'+ic(icon)+'<h3>'+esc(title)+'</h3><p>'+esc(text)+'</p>'
      +(btnLabel?'<button class="btn btn--primary" data-act="'+btnAct+'" style="display:inline-flex">'+ic("plus")+btnLabel+'</button>':'')+'</div>';
  }

  /* ============ PANEL ============ */
  function viewPanel(){
    var conf=countEstado("confirmado");
    var cot=countEstado("cotizado");
    var enViaje=state.encargos.filter(function(e){return e.estado==="realizado";}).length;
    var entregar=paraEntregar().length;
    var m=min();
    var pct=Math.min(100,Math.round(conf/m*100));
    var faltan=Math.max(0,m-conf);

    var banner;
    if(state.pedidos.length===0 && state.clientes.length===0){
      banner='<div class="banner"><div class="txt"><b>¡Bienvenidos a Guriche!</b>'
        +'<p>Empezá cargando un pedido de un cliente, o probá con datos de ejemplo.</p></div>'
        +'<button class="btn btn--primary" data-act="pedido:new">'+ic("plus")+'Pedido</button></div>';
    } else if(conf>=m){
      banner='<div class="banner"><div class="txt"><b>¡Ya podés armar un encargo!</b>'
        +'<p>Tenés <b>'+conf+'</b> perfumes confirmados (mínimo '+m+'). Es momento de hacer el pedido a Ciudad del Este.</p></div>'
        +'<button class="btn btn--primary" data-act="encargo:new">'+ic("box")+'Armar</button></div>';
    } else if(conf>0){
      banner='<div class="banner" style="background:var(--surface-2);border-color:var(--border-strong)"><div class="txt">'
        +'<b>Faltan '+faltan+' para el próximo encargo</b>'
        +'<p>Llevás <b>'+conf+'</b> de '+m+' confirmados. Cuando junten '+m+' conviene traerlos juntos.</p></div></div>';
    } else banner="";

    var stats='<div class="grid stat-grid">'
      +stat("amber","Confirmados",conf,faltan>0?("faltan "+faltan+" para "+m):"listos para encargar")
      +stat("slate","Cotizaciones",cot,"esperando respuesta")
      +stat("blue","Encargos en viaje",enViaje,"pendientes de llegada")
      +stat("green","Para entregar",entregar,"ya llegaron")
      +'</div>';

    var prog='<div class="card stat amber" style="margin-top:14px;padding:18px">'
      +'<div class="k">Progreso hacia el próximo encargo</div>'
      +'<div style="display:flex;align-items:baseline;gap:8px;margin-top:4px">'
      +'<span class="v" style="font-size:30px">'+conf+'</span><span style="color:var(--muted)">/ '+m+' confirmados</span></div>'
      +'<div class="bar"><i style="width:'+pct+'%"></i></div></div>';

    // confirmados sin encargo (lista corta)

    var list=state.catalogo.filter(function(p){
      if(ui.filter!=="todos" && p.categoria!==ui.filter) return false;
      if(q){
        return (p.nombre||"").toLowerCase().indexOf(q)>=0 || (p.marca||"").toLowerCase().indexOf(q)>=0;
      }
      return true;
    }).sort(function(a,b){ return (a.nombre||"").localeCompare(b.nombre||""); });

    var items = list.length? '<div class="cat-grid">' + list.map(catalogoCard).join("") + '</div>'
      : '<div class="card empty" style="padding:34px"><p>No hay perfumes con ese filtro.</p></div>';

    return head+chipHtml+search+items;
  }

  /* ============ MODALES ============ */
  function renderModal(){
    var m=ui.modal, body="", title="";
    if(m.type==="pedido"){ title=m.data.id?"Editar pedido":"Nuevo pedido"; body=formPedido(m.data); }
    else if(m.type==="cliente"){ title=m.data.id?"Editar cliente":"Nuevo cliente"; body=formCliente(m.data); }
    else if(m.type==="prov"){ title=m.data.id?"Editar proveedor":"Nuevo proveedor"; body=formProv(m.data); }
    else if(m.type==="prod"){ title="Agregar perfume"; body=formProd(m.data); }
    else if(m.type==="encargo"){ title=m.data.id?"Editar encargo":"Nuevo encargo"; body=formEncargo(m.data); }
    else if(m.type==="asignar"){ title="Asignar confirmados"; body=formAsignar(m.data); }
    else if(m.type==="tarea"){ title=m.data.id?"Editar tarea":"Nueva tarea"; body=formTarea(m.data); }
    else if(m.type==="catprod"){ title=m.data.id?"Editar perfume":"Nuevo perfume al catálogo"; body=formCatProd(m.data); }
    else if(m.type==="settings"){ title="Ajustes"; body=formSettings(); }
    else if(m.type==="confirm"){ title=m.data.title; body=formConfirm(m.data); }
    return '<div class="overlay" data-act="overlay"><div class="modal" role="dialog" aria-modal="true">'
      +'<div class="modal-head"><h2>'+esc(title)+'</h2>'
      +'<button class="btn btn--ghost" data-act="modal:close" aria-label="Cerrar">'+ic("close")+'</button></div>'
      +'<div class="modal-body"><form id="modal-form" data-type="'+m.type+'">'+body+'</form></div></div></div>';
  }

  /* ============ acciones de datos ============ */
  function openModal(type,data){ ui.modal={type:type,data:data||{}}; render(); }
  function closeModal(){ ui.modal=null; render(); }

  function formData(form){
    var o={}; var fd=new FormData(form);
    fd.forEach(function(v,k){ if(o[k]===undefined) o[k]=v; else { if(!Array.isArray(o[k])) o[k]=[o[k]]; o[k].push(v); } });
    return o;
  }

  function submitForm(form){
    var type=form.getAttribute("data-type");
    var d=formData(form);
    if(type==="pedido") savePedido(d);
    else if(type==="cliente") saveCliente(d);
    else if(type==="prov") saveProv(d);
    else if(type==="prod") saveProd(d);
    else if(type==="encargo") saveEncargo(d);
    else if(type==="asignar") saveAsignar(d);
    else if(type==="tarea") saveTarea(d);
    else if(type==="catprod") saveCatProd(d);
    else if(type==="settings") saveSettings(d);
  }

  function savePedido(d){
    var editing=ui.modal.data.id;
    var clienteId=d.clienteId;
    if(!clienteId && d.nuevoCliente && d.nuevoCliente.trim()){
      var c={id:uid(),nombre:d.nuevoCliente.trim(),telefono:"",contacto:"",notas:"",creado:Date.now()};
      state.clientes.push(c); clienteId=c.id;
    }
    if(!clienteId){ showToast("Elegí o escribí un cliente"); return; }
    if(!d.perfume || !d.perfume.trim()){ showToast("Falta el nombre del perfume"); return; }
    if(editing){
      var p=byId(state.pedidos,editing);
      if(p){ p.clienteId=clienteId; p.perfume=d.perfume.trim(); p.proveedorId=d.proveedorId||"";
        p.precioVenta=num(d.precioVenta); p.precioCosto=num(d.precioCosto); p.sena=num(d.sena);
        p.estado=d.estado||"cotizado"; p.notas=(d.notas||"").trim(); }
    } else {
      state.pedidos.push({id:uid(),clienteId:clienteId,perfume:d.perfume.trim(),proveedorId:d.proveedorId||"",
        precioVenta:num(d.precioVenta),precioCosto:num(d.precioCosto),sena:num(d.sena),
        estado:d.estado||"cotizado",notas:(d.notas||"").trim(),encargoId:"",creado:Date.now()});
    }
    ui.modal=null; persist();
  }
  function saveCliente(d){
    if(!d.nombre||!d.nombre.trim()){ showToast("Falta el nombre"); return; }
    var editing=ui.modal.data.id;
    if(editing){ var c=byId(state.clientes,editing); if(c){ c.nombre=d.nombre.trim(); c.telefono=(d.telefono||"").trim(); c.contacto=(d.contacto||"").trim(); c.notas=(d.notas||"").trim(); } }
    else state.clientes.push({id:uid(),nombre:d.nombre.trim(),telefono:(d.telefono||"").trim(),contacto:(d.contacto||"").trim(),notas:(d.notas||"").trim(),creado:Date.now()});
    ui.modal=null; persist();
  }
  function saveProv(d){
    if(!d.nombre||!d.nombre.trim()){ showToast("Falta el nombre"); return; }
    var editing=ui.modal.data.id;
    if(editing){ var p=byId(state.proveedores,editing); if(p){ p.nombre=d.nombre.trim(); p.contacto=(d.contacto||"").trim(); } }
    else state.proveedores.push({id:uid(),nombre:d.nombre.trim(),contacto:(d.contacto||"").trim(),productos:[],creado:Date.now()});
    ui.modal=null; persist();
  }
  function saveProd(d){
    var pr=byId(state.proveedores,d.proveedorId); if(!pr) return;
    if(!d.perfume||!d.perfume.trim()){ showToast("Falta el perfume"); return; }
    pr.productos=pr.productos||[];
    pr.productos.push({id:uid(),perfume:d.perfume.trim(),precio:num(d.precio),stock:num(d.stock)});
    ui.modal=null; persist();
  }
  function saveEncargo(d){
    if(!d.nombre||!d.nombre.trim()){ showToast("Falta el nombre"); return; }
    var editing=ui.modal.data.id;
    if(editing){ var e=byId(state.encargos,editing); if(e){ e.nombre=d.nombre.trim(); e.fecha=d.fecha; e.notas=(d.notas||"").trim(); } }
    else state.encargos.push({id:uid(),nombre:d.nombre.trim(),fecha:d.fecha||today(),notas:(d.notas||"").trim(),estado:"armando",creado:Date.now()});
    ui.modal=null; persist();
  }
  function saveAsignar(d){
    var encId=d.encargoId;
    var picked=d.pid?(Array.isArray(d.pid)?d.pid:[d.pid]):[];
    // limpiar los que estaban y ya no
    state.pedidos.forEach(function(p){ if(p.encargoId===encId && picked.indexOf(p.id)<0) p.encargoId=""; });
    picked.forEach(function(id){ var p=byId(state.pedidos,id); if(p) p.encargoId=encId; });
    ui.modal=null; persist();
  }
  function saveTarea(d){
    if(!d.titulo||!d.titulo.trim()){ showToast("Falta el título de la tarea"); return; }
    var editing=ui.modal.data.id;
    if(editing){
      var t=byId(state.tareas,editing);
      if(t){
        t.titulo=d.titulo.trim();
        t.descripcion=(d.descripcion||"").trim();
        t.asignado=d.asignado||"juano";
        t.prioridad=d.prioridad||"media";
        t.fecha=d.fecha||today();
      }
    } else {
      state.tareas.push({
        id:uid(),
        titulo:d.titulo.trim(),
        descripcion:(d.descripcion||"").trim(),
        asignado:d.asignado||"juano",
        prioridad:d.prioridad||"media",
        estado:"pendiente",
        fecha:d.fecha||today(),
        creado:Date.now()
      });
    }
    ui.modal=null; persist();
  }
  function saveCatProd(d){
    if(!d.nombre||!d.nombre.trim()){ showToast("Falta el nombre del perfume"); return; }
    var editing=ui.modal.data.id;
    if(editing){
      var c=byId(state.catalogo,editing);
      if(c){
        c.nombre=d.nombre.trim();
        c.marca=(d.marca||"").trim();
        c.categoria=d.categoria||"disenador";
        c.precioGuriche=num(d.precioGuriche);
        c.precioCosto=num(d.precioCosto);
        c.disponible=Boolean(d.disponible);
        c.notas=(d.notas||"").trim();
      }
    } else {
      state.catalogo.push({
        id:uid(),
        nombre:d.nombre.trim(),
        marca:(d.marca||"").trim(),
        categoria:d.categoria||"disenador",
        precioGuriche:num(d.precioGuriche),
        precioCosto:num(d.precioCosto),
        disponible:Boolean(d.disponible),
        notas:(d.notas||"").trim(),
        creado:Date.now()
      });
    }
    ui.modal=null; persist();
  }
  function saveSettings(d){
    state.config.negocio=(d.negocio||"Guriche").trim()||"Guriche";
    state.config.moneda=(d.moneda||"$").trim()||"$";
    state.config.minEncargo=Math.max(1,parseInt(d.minEncargo,10)||MIN_DEFAULT);
    var url = (d.sheetsUrl||"").trim();
    state.config.sheetsUrl = url;
    lsSet("sheetsUrl", url);
    ui.modal=null;
    persist();
    if(url){
      showToast("Conectando con Google Sheets…");
      syncWithSheets("push", false);
    } else {
      showToast("Ajustes guardados");
    }
  }

  /* ============ manejo de eventos ============ */
  function closest(el,attr){ while(el&&el!==document){ if(el.getAttribute&&el.getAttribute(attr)!=null) return el; el=el.parentNode; } return null; }

  document.addEventListener("click",function(ev){
    var t=closest(ev.target,"data-act");
    if(!t) return;
    var act=t.getAttribute("data-act");
    var id=t.getAttribute("data-id");
    var pid=t.getAttribute("data-pid");

    if(readOnly && ["seed","wipe","pedido:new","cliente:new","prov:new","encargo:new","pedido:newfor","prod:new","tarea:new","cat:new"].indexOf(act)>=0){
      showToast("Solo lectura"); return;
    }

    switch(act){
      case "nav": ui.view=t.getAttribute("data-view"); ui.showMore=false; ui.q=""; ui.filter="todos"; render(); window.scrollTo(0,0); break;
      case "more:toggle": ui.showMore=!ui.showMore; render(); break;
      case "sheets:pull": syncWithSheets("pull", false); break;
      case "sheets:push": syncWithSheets("push", false); break;
      case "theme:toggle": {
        var cur = document.documentElement.getAttribute("data-theme") || "light";
        var next = cur === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        lsSet("theme", next);
        render();
        showToast(next==="dark" ? "Modo oscuro activado" : "Modo Crema activado");
      } break;
      case "settings": openModal("settings",{}); break;
      case "modal:close": case "overlay":
        if(act==="overlay" && ev.target!==t) return;
        closeModal(); break;
      case "filter": ui.filter=t.getAttribute("data-f"); render(); break;

      case "pedido:new": openModal("pedido",{}); break;
      case "pedido:newfor": openModal("pedido",{clienteId:id}); break;
      case "pedido:edit": openModal("pedido",Object.assign({},byId(state.pedidos,id))); break;
      case "pedido:open": ui.view="pedidos"; ui.q=""; ui.filter="todos"; render(); break;
      case "pedido:del": confirmDel("Borrar pedido","¿Seguro que querés borrar este pedido?",function(){
          state.pedidos=state.pedidos.filter(function(p){return p.id!==id;}); persist(); }); break;
      case "pedido:entregar": { var pe=byId(state.pedidos,id); if(pe){ pe.estado="entregado"; persist(); showToast("¡Entregado!"); } } break;

      case "cliente:new": openModal("cliente",{}); break;
      case "cliente:edit": openModal("cliente",Object.assign({},byId(state.clientes,id))); break;
      case "cliente:toggle": ui.expanded["c"+id]=!ui.expanded["c"+id]; render(); break;
      case "cliente:del": {
        var np=pedidosDe(id).length;
        confirmDel("Borrar cliente", np?("Este cliente tiene "+np+" pedido(s). Se borrarán también. ¿Continuar?"):"¿Borrar este cliente?",function(){
          state.pedidos=state.pedidos.filter(function(p){return p.clienteId!==id;});
          state.clientes=state.clientes.filter(function(c){return c.id!==id;}); persist(); });
      } break;

      case "prov:new": openModal("prov",{}); break;
      case "prov:edit": openModal("prov",Object.assign({},byId(state.proveedores,id))); break;
      case "prov:del": confirmDel("Borrar proveedor","¿Borrar este proveedor y su lista de perfumes?",function(){
          state.proveedores=state.proveedores.filter(function(p){return p.id!==id;}); persist(); }); break;
      case "prod:new": openModal("prod",{proveedorId:id}); break;
      case "prod:del": { var pr=byId(state.proveedores,id); if(pr){ pr.productos=(pr.productos||[]).filter(function(x){return x.id!==pid;}); persist(); } } break;

      case "encargo:new": openModal("encargo",{}); break;
      case "encargo:edit": openModal("encargo",Object.assign({},byId(state.encargos,id))); break;
      case "encargo:asignar": openModal("asignar",{encargoId:id}); break;
      case "encargo:quitar": { var pq=byId(state.pedidos,pid); if(pq){ pq.encargoId=""; if(pq.estado==="encargado") pq.estado="confirmado"; persist(); } } break;
      case "encargo:avanzar": avanzarEncargo(id); break;
      case "encargo:del": confirmDel("Borrar encargo","Los perfumes volverán a quedar sin encargo. ¿Borrar?",function(){
          state.pedidos.forEach(function(p){ if(p.encargoId===id){ p.encargoId=""; if(p.estado==="encargado") p.estado="confirmado"; } });
          state.encargos=state.encargos.filter(function(e){return e.id!==id;}); persist(); }); break;

      case "tarea:new": openModal("tarea",{}); break;
      case "tarea:edit": openModal("tarea",Object.assign({},byId(state.tareas,id))); break;
      case "tarea:toggle": {
        var tr=byId(state.tareas,id);
        if(tr){
          tr.estado = tr.estado==="hecha" ? "pendiente" : "hecha";
          persist();
          showToast(tr.estado==="hecha" ? "¡Tarea completada! 🎉" : "Tarea reabierta");
        }
      } break;
      case "tarea:del": confirmDel("Borrar tarea","¿Seguro que querés borrar esta tarea?",function(){
          state.tareas=state.tareas.filter(function(t){return t.id!==id;}); persist(); }); break;

      case "cat:new": openModal("catprod",{disponible:true}); break;
      case "cat:edit": openModal("catprod",Object.assign({},byId(state.catalogo,id))); break;
      case "cat:pedido": {
        var cp=byId(state.catalogo,id);
        if(cp){
          openModal("pedido",{
            perfume: cp.nombre + (cp.marca?' ('+cp.marca+')':''),
            precioVenta: cp.precioGuriche,
            precioCosto: cp.precioCosto
          });
        }
      } break;
      case "cat:del": confirmDel("Borrar del catálogo","¿Borrar este perfume del catálogo?",function(){
          state.catalogo=state.catalogo.filter(function(c){return c.id!==id;}); persist(); }); break;

      case "seed": doSeed(); break;
      case "wipe": confirmDel("Borrar todo","Esto elimina clientes, pedidos, proveedores, encargos, tareas y catálogo. No se puede deshacer.",function(){
          state.clientes=[];state.proveedores=[];state.pedidos=[];state.encargos=[];state.tareas=[];state.catalogo=[]; persist(); }); break;

      case "confirm:yes": if(ui.modal&&ui.modal.data&&ui.modal.data.fn){ var fn=ui.modal.data.fn; ui.modal=null; fn(); } break;
    }
  });

  document.addEventListener("submit",function(ev){
    if(ev.target && ev.target.id==="modal-form"){ ev.preventDefault(); if(readOnly){showToast("Solo lectura");return;} submitForm(ev.target); }
  });
  document.addEventListener("change",function(ev){
    var t=ev.target;
    if(t&&t.getAttribute&&t.getAttribute("data-act")==="pedido:estado"){
      if(readOnly){ showToast("Solo lectura"); render(); return; }
      var p=byId(state.pedidos,t.getAttribute("data-id"));
      if(p){ p.estado=t.value; if(p.estado!=="encargado"&&p.estado!=="entregado"&&p.encargoId){ /* deja el vínculo */ } persist(); }
    }
    if(t&&t.getAttribute&&t.getAttribute("data-act")==="cat:fill"){
      var cp=byId(state.catalogo,t.value);
      if(cp){
        var form=t.closest("form");
        if(form){
          var inpPerf=form.querySelector('input[name="perfume"]');
          var inpVenta=form.querySelector('input[name="precioVenta"]');
          var inpCosto=form.querySelector('input[name="precioCosto"]');
          if(inpPerf) inpPerf.value = cp.nombre + (cp.marca?' ('+cp.marca+')':'');
          if(inpVenta) inpVenta.value = cp.precioGuriche || '';
          if(inpCosto) inpCosto.value = cp.precioCosto || '';
        }
      }
    }
    // toggle visual de checks en asignar
    if(t&&t.type==="checkbox"&&t.name==="pid"){ var lab=t.closest(".check"); if(lab) lab.classList.toggle("on",t.checked); }
  });
  document.addEventListener("input",function(ev){
    var t=ev.target;
    if(t&&t.getAttribute&&t.getAttribute("data-act")==="search"){ ui.q=t.value; ui._focusSearch=true; render(); }
  });

  function avanzarEncargo(id){
    var e=byId(state.encargos,id); if(!e) return;
    if(e.estado==="armando"){
      var n=pedidosDeEncargo(id).length, m=min();
      var go=function(){ e.estado="realizado";
        pedidosDeEncargo(id).forEach(function(p){ if(p.estado==="cotizado"||p.estado==="confirmado") p.estado="encargado"; });
        persist(); showToast("Encargo marcado como pedido"); };
      if(n===0){ showToast("Asigná al menos un perfume"); return; }
      if(n<m){ confirmGeneric("Menos de "+m,"Este encargo tiene "+n+" perfume(s), menos del mínimo de "+m+". ¿Hacerlo igual?","Sí, hacerlo",go); }
      else go();
    } else if(e.estado==="realizado"){
      e.estado="llegado"; persist(); showToast("¡Encargo recibido! Ya podés entregar.");
    }
  }
  function confirmDel(title,text,fn){ openModal("confirm",{title:title,text:text,ok:"Borrar",fn:fn}); }
  function confirmGeneric(title,text,ok,fn){ openModal("confirm",{title:title,text:text,ok:ok,fn:fn}); }

  /* ============ toast ============ */
  var toastTimer;
  function showToast(msg){
    var old=document.querySelector(".toast"); if(old) old.remove();
    var el=document.createElement("div"); el.className="toast"; el.textContent=msg;
    document.body.appendChild(el);
    clearTimeout(toastTimer); toastTimer=setTimeout(function(){ el.remove(); },2600);
  }

  /* ============ datos de ejemplo ============ */

      {id:uid(),titulo:"Confirmar stock de La Vie Est Belle",descripcion:"Ver si quedan unidades en el local de CDE",asignado:"juano",prioridad:"media",estado:"pendiente",fecha:today(),creado:Date.now()}

  /* ============ init ============ */
  var initialTheme = lsGet("theme", "light");
  document.documentElement.setAttribute("data-theme", initialTheme);
  ensureApi().then(function(a){
    // Si estamos en un viewer que otorga artifact pero la vista es de solo lectura,
    // lo detectamos recién al primer publish. No forzamos nada acá.
  });
  render();
  if(getSheetsUrl()){
    syncWithSheets("pull", true);
  }
  window.addEventListener("keydown",function(e){ if(e.key==="Escape" && ui.modal){ closeModal(); } });
})();
</script>
